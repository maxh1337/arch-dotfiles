# Generated by Matugen
$image = {{ image }}

# Matugen hyprland colors template
$image = {{ image }}

# Background / surfaces
$bg                = {{ colors.background.default.hex }}            # основной фон
$surface           = {{ colors.surface.default.hex }}               # поверхности / панель
$surface_low       = {{ colors.surface_container_low.default.hex }} # панель — низкий контраст
$surface_high      = {{ colors.surface_container_high.default.hex }}

# Foreground / text
$fg                = {{ colors.on_background.default.hex }}
$fg_on_surface     = {{ colors.on_surface.default.hex }}

# Accent (primary)
$accent            = {{ colors.primary.default.hex }}
$accent_light      = {{ colors.primary.light.hex }}
$accent_dark       = {{ colors.primary.dark.hex }}
$accent_strong     = {{ palettes.primary._90.hex }}  # яркий вариант

# Neutrals / borders
$border            = {{ palettes.neutral_variant._40.hex }}
$inactive          = {{ palettes.neutral._40.hex }}

# Status
$error             = {{ colors.error.default.hex }}
$warning           = {{ palettes.error._60.hex }}
$success           = {{ palettes.tertiary._80.hex }}

# Optional tints (подкраска окна/панели от source color)
$source            = {{ colors.source_color.default.hex }}
$surface_tint      = {{ colors.surface_tint.default.hex }}

# Alpha helpers (если Hyprland принимает RRGGBBAA — можно формировать #RRGGBBAA)
$accent_80         = {{ colors.primary.default.hex }}CC
$accent_50         = {{ colors.primary.default.hex }}80
$bg_90             = {{ colors.background.default.hex }}E6

